# Strategy Optimizer -- its OWN project, network, DB and container names.
# Always run with this file's project name (set below); it shares nothing with
# the tastytrade-market-recorder / the-well compose projects except that the
# runner calls The Well's HTTP API (after hours, DayPack pulls only).
name: strategy-optimizer

networks:
  # Fixed subnet so the ollama-proxy service (network_mode: host) can bind to
  # a known, stable gateway address instead of whatever Docker auto-assigns.
  default:
    ipam:
      config:
        - subnet: 172.30.90.0/24

services:
  # Ollama on the host listens on 127.0.0.1 only; this relays it onto the
  # bridge gateway address so the server container can reach it without
  # widening Ollama's own exposure. See ollama-proxy/nginx.conf.
  ollama-proxy:
    image: nginx:alpine
    container_name: strategy-optimizer-ollama-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ollama-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16-alpine
    container_name: strategy-optimizer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
      POSTGRES_DB: optimizer
    # Sim tables are UNLOGGED scratch; keep fsync on for the results tables.
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=200", "-c", "synchronous_commit=off"]
    cpus: "6" # scratch + results DB; counted against Redfish's budget too
    volumes:
      - ${OPT_HOST_DATA:-/mnt/data/optimizer}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer"]
      interval: 5s
      timeout: 3s
      retries: 20

  runner:
    build: .
    image: strategy-optimizer-runner
    container_name: strategy-optimizer-runner
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./vendor/strike-canopy:/app/vendor/strike-canopy:ro
      - ./test:/app/test:ro
      - ./examples:/app/examples:ro
      - ${OPT_HOST_DATA:-/mnt/data/optimizer}/cache:/data

  # The web UI + API + run queue (port 8430 on the LAN). Worker processes
  # are forked INSIDE this container, so `cpus` is a hard ceiling on the
  # whole optimizer: Redfish has 72 threads and the local AI uses about
  # half, so the optimizer is held to OPT_MAX_THREADS (default 30).
  server:
    image: strategy-optimizer-runner
    container_name: strategy-optimizer-server
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      OPT_MAX_THREADS: "${OPT_MAX_THREADS:-30}"
      OPT_PORT: "8430"
      LOG_LEVEL: info
      # AI analysis (on-demand, src/analysis): Redfish's own Ollama, reached
      # through the ollama-proxy service since Ollama itself is bound to the
      # host's 127.0.0.1 only.
      OPT_OLLAMA_URL: "${OPT_OLLAMA_URL:-http://172.30.90.1:11435}"
      OPT_OLLAMA_MODEL: "${OPT_OLLAMA_MODEL:-qwen3:30b-a3b-ctx32k}"
    command: ["node", "--import", "tsx", "src/server/server.ts"]
    cpus: "${OPT_MAX_THREADS:-30}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${OPT_BIND:-192.168.4.31}:8430:8430"
    volumes:
      - ./src:/app/src:ro
      - ./ui:/app/ui:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./vendor/strike-canopy:/app/vendor/strike-canopy:ro
      - ./vendor/strike-canopy.ref:/app/vendor/strike-canopy.ref:ro
      - ${OPT_HOST_DATA:-/mnt/data/optimizer}/cache:/data
