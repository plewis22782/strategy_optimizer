# Ollama on Redfish binds 127.0.0.1 only (loopback), so a container on the
# strategy-optimizer bridge network can't reach it directly. This proxy runs
# with network_mode: host and listens ONLY on the strategy-optimizer network's
# own gateway address -- reachable from containers on that bridge (and from
# the host itself), not from other LAN hosts, so Ollama's own exposure never
# changes. See docker-compose.yml's fixed subnet for the 172.30.90.1 address.
events {}
http {
  server {
    listen 172.30.90.1:11435;
    location / {
      proxy_pass http://127.0.0.1:11434;
      proxy_buffering off;
      # Longer than OPT_OLLAMA_TIMEOUT_MS (server.ts) so the Node client's own
      # AbortController times out first and reports a clear error, instead of
      # nginx cutting the upstream off with an opaque 504 (confirmed live
      # 2026-10-02: qwen3:30b's thinking overhead on a real analysis prompt
      # blew well past the old 300s).
      proxy_read_timeout 1260s;
    }
  }
}
